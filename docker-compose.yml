services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ofertamestre}
      POSTGRES_USER: ${POSTGRES_USER:-ofertamestre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      MERCADOLIVRE_CLIENT_ID: ${MERCADOLIVRE_CLIENT_ID:-}
      MERCADOLIVRE_CLIENT_SECRET: ${MERCADOLIVRE_CLIENT_SECRET:-}
      MERCADOLIVRE_REDIRECT_URI: ${MERCADOLIVRE_REDIRECT_URI:-}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      STEAM_WEB_API_BASE_URL: ${STEAM_WEB_API_BASE_URL:-https://api.steampowered.com}
      STEAM_STORE_BASE_URL: ${STEAM_STORE_BASE_URL:-https://store.steampowered.com}
      STEAM_APPDETAILS_ENABLED: ${STEAM_APPDETAILS_ENABLED:-false}
      STEAM_COUNTRY_CODE: ${STEAM_COUNTRY_CODE:-br}
      STEAM_PRICE_CACHE_TTL_SECONDS: ${STEAM_PRICE_CACHE_TTL_SECONDS:-300}
      STEAM_PRICE_CACHE_MAX_ENTRIES: ${STEAM_PRICE_CACHE_MAX_ENTRIES:-1000}
      AMAZON_CREATORS_CLIENT_ID: ${AMAZON_CREATORS_CLIENT_ID:-}
      AMAZON_CREATORS_CLIENT_SECRET: ${AMAZON_CREATORS_CLIENT_SECRET:-}
      AMAZON_CREATORS_PARTNER_TAG: ${AMAZON_CREATORS_PARTNER_TAG:-}
      AMAZON_CREATORS_MARKETPLACE: ${AMAZON_CREATORS_MARKETPLACE:-www.amazon.com.br}
      AMAZON_CREATORS_API_BASE_URL: ${AMAZON_CREATORS_API_BASE_URL:-https://creatorsapi.amazon}
      AMAZON_CREATORS_TOKEN_URL: ${AMAZON_CREATORS_TOKEN_URL:-https://api.amazon.com/auth/o2/token}
      AWIN_PUBLISHER_ID: ${AWIN_PUBLISHER_ID:-}
      AWIN_API_TOKEN: ${AWIN_API_TOKEN:-}
      AWIN_API_BASE_URL: ${AWIN_API_BASE_URL:-https://api.awin.com}
      MAGALU_CLIENT_ID: ${MAGALU_CLIENT_ID:-}
      MAGALU_CLIENT_SECRET: ${MAGALU_CLIENT_SECRET:-}
      MAGALU_REDIRECT_URI: ${MAGALU_REDIRECT_URI:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
